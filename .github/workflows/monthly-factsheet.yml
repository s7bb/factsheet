name: Monatsdatenblatt S7 Baierbrunn

# Laeuft am 2. jedes Monats um 06:00 UTC (der Vormonat ist dann finalisiert)
# und laesst sich zusaetzlich manuell mit optionalem Monat anstossen.
# Skript und CLAUDE.md liegen im Unterverzeichnis factsheet/.
on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Berichtsmonat YYYY-MM (leer = Vormonat)"
        required: false
        default: ""

permissions:
  contents: write        # noetig, damit das erzeugte PDF committet werden kann

concurrency:
  group: factsheet
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest   # bringt Node.js 22 bereits mit
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r factsheet/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Datenblatt erzeugen
        working-directory: factsheet
        env:
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          # Deterministischer Generator, kein LLM. Leerer Monat = Vormonat.
          if [ -n "$INPUT_MONTH" ]; then
            python generate.py --month "$INPUT_MONTH"
          else
            python generate.py
          fi

      - name: Ergebnis committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain factsheet/output/)" ]; then
            git add factsheet/output/
            git commit -m "Datenblatt automatisch aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Keine Aenderungen in factsheet/output/ - nichts zu committen."
          fi

      - name: PDF als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: s7bb-datenblatt
          path: factsheet/output/*.pdf
          if-no-files-found: warn
