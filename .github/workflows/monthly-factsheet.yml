name: Monatsdatenblatt S7 Baierbrunn

# Laeuft am 1. jedes Monats um 12:00 UTC (fuer den Vormonat) und laesst sich
# zusaetzlich manuell mit optionalem Monat anstossen. Das erzeugte PDF wird als
# GitHub-Release mit Tag MM.YYYY (z. B. 07.2026) veroeffentlicht.
# Skript und CLAUDE.md liegen im Unterverzeichnis factsheet/.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Berichtsmonat YYYY-MM (leer = Vormonat)"
        required: false
        default: ""

permissions:
  contents: write        # noetig, um Release + Tag anzulegen

concurrency:
  group: factsheet
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest   # bringt Node.js 22 bereits mit
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r factsheet/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Datenblatt erzeugen
        working-directory: factsheet
        env:
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          # Deterministischer Generator, kein LLM. Leerer Monat = Vormonat.
          # stderr wird mitgeloggt, damit die Warnungen des Generators pruefbar sind.
          set -euo pipefail
          if [ -n "$INPUT_MONTH" ]; then
            python generate.py --month "$INPUT_MONTH" 2>&1 | tee gen.log
            python schulweg.py --month "$INPUT_MONTH" 2>&1 | tee -a gen.log
          else
            python generate.py 2>&1 | tee gen.log
            python schulweg.py 2>&1 | tee -a gen.log
          fi
          # Finalisierungs-Guard: nicht finalisierten Monat NICHT veroeffentlichen.
          if grep -q 'noch nicht finalisiert' gen.log; then
            echo "::error::Berichtsmonat noch nicht finalisiert - Abbruch, kein Release." >&2
            exit 1
          fi
          # Plausibilitaets-Guard: kaputtes (mehrseitiges) Layout nicht veroeffentlichen.
          if grep -q '> eine A4-Seite' gen.log; then
            echo "::error::Inhalt > eine A4-Seite - Anomalie, kein Release." >&2
            exit 1
          fi
          # PDF-Pfade und Berichtsmonat aus der Generator-Ausgabe ableiten.
          # sort -u, weil beide Generatoren in dieselbe Logdatei schreiben;
          # head -n1 beim Monat, weil beide ihn ausgeben.
          PDFS=$(grep -oE 'output/[^ ]+\.pdf' gen.log | sort -u | sed 's#^#factsheet/#' | tr '\n' ' ')
          YM=$(grep -oE 'Berichtsmonat: [0-9]{4}-[0-9]{2}' gen.log | grep -oE '[0-9]{4}-[0-9]{2}' | head -n1)
          if [ -z "$PDFS" ] || [ -z "$YM" ]; then
            echo "Konnte PDF-Pfade oder Berichtsmonat nicht ermitteln." >&2
            exit 1
          fi
          # Release-Tag im Format MM.YYYY (z. B. 2026-07 -> 07.2026).
          TAG="${YM:5:2}.${YM:0:4}"
          {
            echo "PDF_PATHS=$PDFS"
            echo "REPORT_YM=$YM"
            echo "RELEASE_TAG=$TAG"
          } >> "$GITHUB_ENV"

      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="S7 Baierbrunn Datenblaetter ${REPORT_YM}"
          NOTES="Automatisch erzeugt (${REPORT_YM}): Monatsdatenblatt und Schulweg-Datenblatt."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Release existiert bereits (z. B. Backfill/Re-Run): PDFs ersetzen.
            gh release upload "$RELEASE_TAG" $PDF_PATHS --clobber
          else
            gh release create "$RELEASE_TAG" $PDF_PATHS \
              --title "$TITLE" --notes "$NOTES"
          fi
